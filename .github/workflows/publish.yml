name: Publish MV Futures Signal Scan

# Runs a few times a day. Pulls the base corpus plus every daily delta from the
# shared Google Drive folder, assembles the full corpus, rebuilds the dashboard,
# and commits it so GitHub Pages republishes. Running more than once means a
# late-finishing scan still gets published the same day.
on:
  schedule:
    - cron: '0 17 * * *'      # 13:00 ET — shortly after the noon scan
    - cron: '30 19 * * *'     # 15:30 ET — catches a slow scan
    - cron: '0 23 * * *'      # 19:00 ET — final sweep
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRIVE_FOLDER_ID: 1GuqRzhqAc39x078_iAs_TDRs4uT93d4g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Fetch base corpus and daily deltas from Drive
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, sys, urllib.parse, urllib.request

          key = os.environ.get("GDRIVE_API_KEY")
          folder = os.environ["DRIVE_FOLDER_ID"]
          if not key:
              sys.exit("GDRIVE_API_KEY secret is not set")
          os.makedirs("drive", exist_ok=True)

          def api(params):
              url = "https://www.googleapis.com/drive/v3/files?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)

          files, token = [], None
          while True:
              p = {"q": f"'{folder}' in parents and trashed = false", "key": key,
                   "fields": "nextPageToken,files(id,name,size,modifiedTime)",
                   "pageSize": "200"}
              if token: p["pageToken"] = token
              d = api(p)
              files += d.get("files", [])
              token = d.get("nextPageToken")
              if not token: break

          wanted = [f for f in files
                    if f["name"] == "base-signals.json"
                    or (f["name"].startswith("delta-") and f["name"].endswith(".json"))]
          if not any(f["name"] == "base-signals.json" for f in wanted):
              sys.exit("base-signals.json not found in the Drive folder. "
                       "Is the folder shared as 'Anyone with the link'?")

          for f in sorted(wanted, key=lambda x: x["name"]):
              dl = f"https://www.googleapis.com/drive/v3/files/{f['id']}?alt=media&key={key}"
              with urllib.request.urlopen(dl, timeout=180) as r:
                  data = r.read()
              try:
                  json.loads(data)
              except Exception as e:
                  print(f"  !! {f['name']} is not valid JSON ({e}) — skipping")
                  continue
              open(os.path.join("drive", f["name"]), "wb").write(data)
              print(f"  fetched {f['name']} ({len(data)} bytes)")
          PY

      - name: Assemble the corpus
        run: python3 assemble.py drive signals.json

      - name: Build the dashboard
        run: python3 build_dashboard.py signals.json index.html

      - name: Report freshness
        run: |
          python3 -c "
          import json, datetime
          d = json.load(open('signals.json'))
          lu = d.get('last_updated','?')
          try:
              age = (datetime.date.today() - datetime.date.fromisoformat(lu)).days
              print(f'::notice::Corpus last_updated {lu} ({age} day(s) old), {len(d[\"signals\"])} signals, scan #{d.get(\"scan_count\")}')
              if age >= 2:
                  print(f'::warning::No new scan delta for {age} days — the daily scan may be failing.')
          except Exception:
              print(f'::warning::Could not parse last_updated: {lu}')
          "

      - name: Commit if changed
        run: |
          git config user.name  "MV Futures Scan"
          git config user.email "action@users.noreply.github.com"
          git add -A index.html signals.json logo.png logo-dark.png
          if git diff --staged --quiet; then
            echo "No change since the last build — nothing to publish."
          else
            git commit -m "Refresh signal scan — $(date -u +%Y-%m-%d)"
            git push
          fi
